name: Flutter CI

# Scoping is done per job via the `changes` job, not with a workflow-level
# `paths:` filter — see the comment in web-ci.yml for why.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_debug_apk:
        description: 'Build debug APK'
        required: false
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        required: false
        type: boolean
        default: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      metadata: ${{ steps.filter.outputs.metadata }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Fail open on branch creation, a force-pushed base, or a manual
          # dispatch: run everything rather than risk skipping.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable ($BASE_SHA) — running all jobs."
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            echo "metadata=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          flutter=false
          metadata=false

          if grep -qE '^banana_split_flutter/|^\.github/workflows/flutter-ci\.yml$' <<< "$files"; then
            flutter=true
          fi

          # Store metadata, the F-Droid recipe, the validator itself, and
          # pubspec.yaml — which supplies the versionCode the changelog files
          # are named after, and which F-Droid reads to detect new releases.
          if grep -qE '^(fastlane|fdroid|tools)/|^banana_split_flutter/pubspec\.yaml$|^banana_split_flutter/lib/l10n/|^\.github/workflows/flutter-ci\.yml$' <<< "$files"; then
            metadata=true
          fi

          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "flutter=\`$flutter\` metadata=\`$metadata\`" >> "$GITHUB_STEP_SUMMARY"

  validate-metadata:
    name: Validate Store Metadata
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate F-Droid recipe and fastlane listings
        run: python3 tools/validate_store_metadata.py

  fdroid-foss-lockfile:
    name: F-Droid FOSS Lockfile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    defaults:
      run:
        working-directory: banana_split_flutter

    # F-Droid builds a FOSS variant: its prebuild deletes mobile_scanner from
    # pubspec.yaml before running pub get. The committed pubspec.lock still
    # pins mobile_scanner, so honouring it is impossible by construction —
    # `pub get --enforce-lockfile` fails with "Would change 1 dependency /
    # Unable to satisfy `pubspec.yaml` using `pubspec.lock`". One lockfile
    # cannot describe two different pubspecs, hence a second committed lock.
    #
    # Nothing else exercises this: our own CI never strips mobile_scanner, so
    # F-Droid would be the first place it could fail — and only after a tag,
    # which pins the failure to a commit that a master-branch fix cannot reach.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Replicate the F-Droid FOSS prebuild
        run: |
          set -euo pipefail
          sed -i -e '/mobile_scanner/d' pubspec.yaml
          cp pubspec.lock.fdroid pubspec.lock
          cp lib/widgets/shard_scanner.dart.fdroid lib/widgets/shard_scanner.dart
          echo "mobile_scanner refs left in pubspec.yaml: $(grep -c mobile_scanner pubspec.yaml || true)"

      - name: Resolve with the FOSS lockfile enforced
        run: flutter pub get --enforce-lockfile

      - name: Analyze the FOSS variant
        run: flutter analyze

  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    defaults:
      run:
        working-directory: banana_split_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        # --enforce-lockfile: a plain `pub get` silently re-resolves, so it can
        # never detect that pubspec.lock has drifted out of agreement with
        # pubspec.yaml. F-Droid's canonical Flutter template runs pub get with
        # this flag, so drift that CI tolerates fails there instead.
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-debug-android:
    name: Build Debug APK
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.build_debug_apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banana_split_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        # --enforce-lockfile: a plain `pub get` silently re-resolves, so it can
        # never detect that pubspec.lock has drifted out of agreement with
        # pubspec.yaml. F-Droid's canonical Flutter template runs pub get with
        # this flag, so drift that CI tolerates fails there instead.
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: banana_split_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    # Pinned for the same reason as release.yml's build-windows job: Flutter
    # 3.24.5 cannot detect Visual Studio on the current windows-latest image.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: banana_split_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        # --enforce-lockfile: a plain `pub get` silently re-resolves, so it can
        # never detect that pubspec.lock has drifted out of agreement with
        # pubspec.yaml. F-Droid's canonical Flutter template runs pub get with
        # this flag, so drift that CI tolerates fails there instead.
        run: flutter pub get --enforce-lockfile

      - name: Build release Windows
        run: flutter build windows --release

      - name: Copy launcher script
        run: Copy-Item "windows\launcher\launch.bat" "build\windows\x64\runner\Release\"
        shell: pwsh

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: banana_split_flutter/build/windows/x64/runner/Release/
          retention-days: 7
