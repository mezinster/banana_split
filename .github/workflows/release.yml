name: Release
run-name: "Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }} from ${{ inputs.branch || 'tag' }}"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.1)'
        required: true
        type: string
      branch:
        description: 'Branch to release from'
        required: false
        type: string
        default: 'master'
      release_notes:
        description: 'Release notes (what changed in this version)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            BRANCH="$INPUT_BRANCH"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            BRANCH=$(git branch -r --contains HEAD | head -1 | sed 's|.*origin/||' || echo "unknown")
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          echo "Build Number: ${BUILD_NUMBER}"
          echo "Branch: ${BRANCH}"

      # The build jobs below rewrite pubspec.yaml from VERSION+BUILD_NUMBER, so
      # the artifacts are correctly versioned no matter what is committed. That
      # is exactly what made this failure invisible for v0.8.4: the release
      # shipped as 0.8.4+364 while the committed pubspec still read 0.8.3+3.
      # F-Droid's UpdateCheckData parses the *committed* pubspec, so it never
      # saw a new versionCode and could not offer the update to anyone.
      - name: Refuse to release a version the committed pubspec disagrees with
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)[[:space:]]*$/\1/p' banana_split_flutter/pubspec.yaml)"
          pubspec_code="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)[[:space:]]*$/\2/p' banana_split_flutter/pubspec.yaml)"

          if [ -z "$pubspec_version" ] || [ -z "$pubspec_code" ]; then
            echo "::error::banana_split_flutter/pubspec.yaml has no 'version: <name>+<code>' line"
            exit 1
          fi

          echo "committed pubspec: ${pubspec_version}+${pubspec_code} | releasing: ${VERSION}"

          if [ "$pubspec_version" != "$VERSION" ]; then
            echo "::error::Releasing ${VERSION} but the committed pubspec.yaml says ${pubspec_version}+${pubspec_code}. F-Droid reads the committed pubspec to detect releases, so it would never offer this build. Bump banana_split_flutter/pubspec.yaml (version AND the +versionCode) and commit before releasing."
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banana_split_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        # Enforced so a drifted lockfile fails here rather than in F-Droid,
        # whose Flutter template runs pub get with this flag. Safe before the
        # version rewrite below: `version:` does not affect resolution.
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android
    needs: [version, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banana_split_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        # Enforced so a drifted lockfile fails here rather than in F-Droid,
        # whose Flutter template runs pub get with this flag. Safe before the
        # version rewrite below: `version:` does not affect resolution.
        run: flutter pub get --enforce-lockfile

      - name: Update version in pubspec.yaml
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build_number }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Rename artifacts with version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build_number }}
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/banana-split-${VERSION}+${BUILD}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "artifacts/banana-split-${VERSION}+${BUILD}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: banana_split_flutter/artifacts/*.apk
          retention-days: 90

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: banana_split_flutter/artifacts/*.aab
          retention-days: 90

  build-web:
    name: Build Web App
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NVMRC }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint --max-warnings 0

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Rename artifact with version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp dist/index.html "artifacts/banana-split-web-${VERSION}.html"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-html
          path: artifacts/*.html
          retention-days: 90

  build-windows:
    name: Build Windows
    needs: [version, test]
    # Unpinned again as of Flutter 3.44.8. This was pinned to windows-2022
    # because Flutter 3.24.5 could not locate Visual Studio on the image
    # windows-latest points at, falling back to the "Visual Studio 16 2019"
    # CMake generator and failing. Removing that pin was the concrete payoff of
    # the SDK bump; re-pin only if a runner image regresses again.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: banana_split_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        # Enforced so a drifted lockfile fails here rather than in F-Droid,
        # whose Flutter template runs pub get with this flag. Safe before the
        # version rewrite below: `version:` does not affect resolution.
        run: flutter pub get --enforce-lockfile

      - name: Update version in pubspec.yaml
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build_number }}
        run: |
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $env:VERSION+$env:BUILD" | Set-Content pubspec.yaml
          Select-String -Path pubspec.yaml -Pattern '^version:'
        shell: pwsh

      - name: Build release Windows
        run: flutter build windows --release

      - name: Copy launcher script
        run: Copy-Item "windows\launcher\launch.bat" "build\windows\x64\runner\Release\"
        shell: pwsh

      - name: Create Windows zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build_number }}
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "banana-split-windows-$env:VERSION+$env:BUILD.zip"
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: banana_split_flutter/banana-split-windows-*.zip
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [version, build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/

      - name: Download App Bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: release-artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-artifacts/

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-html
          path: release-artifacts/

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build_number }}
          BRANCH: ${{ needs.version.outputs.branch }}
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
          FL_VERSION: ${{ env.FLUTTER_VERSION }}
        run: |
          cat > release-notes.md << HEADER
          ## Banana Split v${VERSION}

          ### Downloads

          **Android**
          - **APK** — Direct install on Android devices
          - **AAB** — For Google Play Store upload

          **Windows**
          - **ZIP** — Extract and run on Windows x64

          **Web**
          - **HTML** — Single self-contained file, deploy to S3 or open locally

          ### What's New
          HEADER

          if [ -n "$CUSTOM_NOTES" ]; then
            printf '%s\n' "$CUSTOM_NOTES" >> release-notes.md
          else
            echo "See commit history for detailed changes." >> release-notes.md
          fi

          cat >> release-notes.md << EOF

          ### Checksums (SHA-256)
          \`\`\`
          $(cat release-artifacts/checksums-sha256.txt)
          \`\`\`

          ### Build Info
          - Version: ${VERSION}
          - Build Number: ${BUILD}
          - Branch: ${BRANCH}
          - Flutter: ${FL_VERSION}
          EOF

          cat release-notes.md

      - name: Create or update tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_BRANCH: ${{ needs.version.outputs.branch }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -fa "$RELEASE_TAG" -m "Release $RELEASE_TAG from branch $RELEASE_BRANCH"
          git push origin "$RELEASE_TAG" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Banana Split v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/*.zip
            release-artifacts/*.html
            release-artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
