plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.nfcarchiver.banana_split"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            // AGP 8+ defaults this to false, which stores .so files uncompressed:
            // a larger download in exchange for a smaller installed footprint and
            // faster startup. That trade is right for Play, which re-packages the
            // AAB into per-device splits so nobody downloads the universal APK.
            //
            // Our Android users get the universal APK directly, from GitHub
            // Releases and F-Droid, so for them the trade is all cost: the
            // release APK went from 38.5 MB to 78.8 MB on the 3.44.8 bump with
            // no change in payload. Keep the libraries compressed.
            useLegacyPackaging = true
        }
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.nfcarchiver.banana_split"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
